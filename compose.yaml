services:
  reconciler:
    build: .
    image: ghcr.io/francio87/octodns-bind-reconciler:latest
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file:
      - .env
    environment:
      REPOSITORY_URL: ${REPOSITORY_URL}
      REPOSITORY_BRANCH: ${REPOSITORY_BRANCH:-main}
      OCTODNS_CONFIG_FILE: ${OCTODNS_CONFIG_FILE:-config-internal.yaml}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      RETRY_INTERVAL_SECONDS: ${RETRY_INTERVAL_SECONDS:-60}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-120}
      RUN_ONCE: ${RUN_ONCE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GIT_USERNAME: ${GIT_USERNAME:-x-access-token}
      GIT_TOKEN: ${GIT_TOKEN:-}
      BIND_HOST: ${BIND_HOST:-bind9}
      OCTODNS_TSIG_NAME: ${OCTODNS_TSIG_NAME:-}
      OCTODNS_TSIG_SECRET: ${OCTODNS_TSIG_SECRET:-}
    volumes:
      - reconciler-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  reconciler-data:
